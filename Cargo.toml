[package]
name = "crabpi-cli"
version = "1.2.0"
edition = "2024"

[dependencies]
dirs = "7.0.0"
dotenvy = "0.15.7"
env = "1.0.1"
futures-util = "0.3"
mime_guess = "2"
ratatui = "0.30.2"
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7.19"
